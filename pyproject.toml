[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twfactor"
version = "0.1.0"
description = "Cross-sectional factor research and backtesting for Taiwan equities, with TW-specific frictions (transaction tax, price limits)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ml = ["lightgbm>=4"]

[project.scripts]
twfactor = "twfactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
